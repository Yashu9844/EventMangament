<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Our Team - Event Planning</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
    /* Animation Styles */
    .stagger-item {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stagger-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .team-card {
      transition: all 0.3s ease;
      overflow: hidden;
    }
    
    .team-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    
    .team-card:hover .team-member-image {
      transform: scale(1.05);
    }
    
    .team-member-image {
      transition: transform 0.5s ease;
    }
    
    .social-icons {
      transition: all 0.3s ease;
      transform: translateY(100%);
      opacity: 0;
    }
    
    .team-card:hover .social-icons {
      transform: translateY(0);
      opacity: 1;
    }
    
    .skill-bar {
      width: 0;
      transition: width 1.5s ease-in-out;
    }
    
    .featured-tag {
      position: absolute;
      top: 20px;
      right: -60px;
      transform: rotate(45deg);
      width: 200px;
      text-align: center;
      z-index: 10;
    }
    
    /* Parallax effect */
    .parallax-bg {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
    
    /* Animated counter */
    .counter-value {
      display: inline-block;
      animation: countUp 3s forwards;
    }
    
    @keyframes countUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Pulse effect for featured team member */
    .pulse-effect {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.5); }
      70% { box-shadow: 0 0 0 15px rgba(79, 70, 229, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    
    /* Team member hover info animation */
    .info-reveal {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }
    
    .team-card:hover .info-reveal {
      max-height: 200px;
    }
    
    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- Team Section with Animations -->
>

  </script>
</body>
</html>
