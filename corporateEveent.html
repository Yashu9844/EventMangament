<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
  </head>
  <body class="bg-white text-gray-800">

    <section class="py-12 px-4 max-w-7xl mx-auto">
      <h2 class="text-3xl font-bold text-center text-[#9B59B6] mb-10">Photo Gallery</h2>

      <div class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4 cursor-pointer">

        <!-- Repeat un1 to un6 -->
        <img src="/assets/un1.jpg"  alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un2.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un3.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un4.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un5.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/w2.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />

        <!-- Repeating again -->
        <img src="/assets/un1.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un2.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un3.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un4.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/un5.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />
        <img src="/assets/w1.jpg" alt="Gallery" class="w-full rounded-lg hover:scale-105 transition-transform duration-500" />

      </div>
    </section>

  </body>
</html>
