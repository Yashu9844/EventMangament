<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-800">

    <section class="py-12 px-4 max-w-7xl mx-auto">
      <h2 class="text-3xl font-bold text-center text-[#9B59B6] mb-10">Photo Gallery</h2>

      <div class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4 cursor-pointer">
        <!-- All images start with opacity-0 and translate-y-10 -->
        <img src="/assets/un1.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
        <img src="/assets/un2.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
        <img src="/assets/un3.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
        <img src="/assets/un4.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
        <img src="/assets/un5.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
        <img src="/assets/w2.jpg" alt="Gallery"
          class="gallery-img w-full rounded-lg opacity-0 translate-y-10 transition-all duration-700 ease-out hover:scale-105" />
      </div>
    </section>

    <!-- Minimal JS for scroll-triggered animation -->
    <script>
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.remove('opacity-0', 'translate-y-10');
              entry.target.classList.add('opacity-100', 'translate-y-0');
            }, 1000); // 1s delay
            observer.unobserve(entry.target);
          }
        });
      });

      document.querySelectorAll('.gallery-img').forEach(img => observer.observe(img));
    </script>

  </body>
</html>
